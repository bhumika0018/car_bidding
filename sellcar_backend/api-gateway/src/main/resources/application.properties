# Application properties
spring.application.name=api-gateway
server.port=8080

# The API Gateway doesn't register itself
eureka.client.register-with-eureka=true
# Enable fetching of service registry
eureka.client.fetch-registry=true
# Eureka server link
eureka.client.service-url.default-zone=http://localhost:8761/eureka/

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Spring Security Credentials
#spring.security.user.name=test
#spring.security.user.password=test



logging.level.com.netflix.discovery=DEBUG
logging.level.org.springframework.cloud.netflix.eureka=DEBUG

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
spring.cloud.gateway.default-filters[0].name=CustomAuthenticationFilter
#spring.cloud.gateway.default-filters[0].name=CustomAuthentication



