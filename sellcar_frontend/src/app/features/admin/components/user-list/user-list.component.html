<div class="container mx-auto px-4 py-6">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Customer List</h1>

    <!-- Search Bar -->
    <div class="mb-4 flex gap-2">
        <input 
            type="text" 
            [(ngModel)]="searchUsername" 
            (ngModelChange)="searchUser()" 
            placeholder="Search by username" 
            class="border border-gray-300 p-2 rounded-lg w-screen"
        />
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="flex justify-center items-center">
      <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-gray-800"></div>
    </div>

    <!-- Error State -->
    <div *ngIf="error" class="bg-red-500 text-white p-4 rounded-lg mb-5">
      <p>An error occurred while fetching the customer data. Please try again later.</p>
    </div>

    <!-- Customer List -->
    <div *ngIf="!loading">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div *ngFor="let customer of filteredCustomers" class="bg-white rounded-lg shadow-lg p-6 flex flex-col">
          <h2 class="text-xl font-semibold text-gray-800">{{ customer.name }}</h2>
          <p class="text-gray-600 mb-4">{{ customer.email }}</p>

          <div class="flex justify-between mt-auto">
            <button 
              (click)="deleteUser(customer.id)" 
              class="bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-800 transition duration-300">
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading && filteredCustomers?.length === 0" class="text-center text-gray-600">
      <p>No customers found.</p>
    </div>
</div>
