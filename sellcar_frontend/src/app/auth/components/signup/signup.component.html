

<body class="bg-gray-50 h-screen flex justify-center items-center">
  <!-- Signup Form -->
  <div class="signup-container bg-white rounded-lg shadow-md p-6 md:p-10 w-11/12 md:w-1/3 max-w-md">
    <!-- Title and description -->
    <h2 class="text-3xl font-semibold text-center text-gray-800 mb-4">Create an Account</h2>
    <p class="text-center text-gray-600 mb-4">Sign up to start exploring our wide range of cars!</p>

    <!-- Signup Form -->
    <form action="#" method="POST" (ngSubmit)="onSignup()">
      <!-- Full Name -->
      <div class="mb-2"> 
        <label for="name" class="block text-lg font-medium text-gray-800">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your full name"
          [(ngModel)]="signupData.name"
          class="w-full mt-2 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-800 focus:outline-none shadow-sm transition duration-300"
          required
        />
      </div>

      <!-- Email Address -->
      <div class="mb-2">
        <label for="email" class="block text-lg font-medium text-gray-800">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          [(ngModel)]="signupData.email"
          class="w-full mt-2 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-800 focus:outline-none shadow-sm transition duration-300"
          required
        />
      </div>

      <!-- Password -->
      <div class="mb-2">
        <label for="password" class="block text-lg font-medium text-gray-800">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          [(ngModel)]="signupData.password"
          class="w-full mt-2 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-800 focus:outline-none shadow-sm transition duration-300"
          required
        />
      </div>

      <!-- Confirm Password -->
      <!-- <div class="mb-2">
        <label for="confirmPassword" class="block text-lg font-medium text-gray-800">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          placeholder="Confirm your password"
          class="w-full mt-2 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-800 focus:outline-none shadow-sm transition duration-300"
          required
        />
      </div> -->

      <!-- Submit Button -->
      <button
        type="submit"
        class="w-full bg-gray-800 text-white py-3 rounded-full font-semibold hover:bg-black transition duration-300"
      >
        Sign Up
      </button>
    </form>

    <!-- Link to login -->
    <p class="mt-4 text-center text-sm text-gray-600">
      Already have an account? 
      <a routerLink="/login" class="text-gray-800 hover:underline">Login here</a>
    </p>
  </div>
<!-- </body> -->
